[server]
ws_addr   = "127.0.0.1:8080"
grpc_addr = "0.0.0.0:50051"

[clients]
# Deprecated migration fallback. Prefer [runtime.runtimes.*.endpoints] below.
talker_addr        = "http://127.0.0.1:50053"
reasoner_addr      = "http://127.0.0.1:50054"
listener_grpc_addr = "http://127.0.0.1:50055"
listener_audio_addr = "127.0.0.1:50056"

[runtime]
profile = "voice_local"
# Dev console still owns child-process launch today. Flip this when Gateway's
# ManagedProcess path replaces console/server/supervisor.ts for this profile.
manage_processes = false

[runtime.runtimes.voice_stack]
enabled = true
managed = true
criticality = "required"
activation = "eager"
restart = "keep_alive"
command = ".venv/bin/python main.py"
command_win32 = ".venv\\Scripts\\python.exe main.py"
cwd = "../talker"
provides = ["talker", "listener", "stt", "vad", "tts"]

[runtime.runtimes.voice_stack.endpoints]
talker_grpc = "http://127.0.0.1:50053"
listener_grpc = "http://127.0.0.1:50055"
listener_audio = "127.0.0.1:50056"

[runtime.runtimes.voice_stack.env]
KAGUYA_TALKER_LISTEN_ADDR = "0.0.0.0:50053"
KAGUYA_LISTENER_GRPC_ADDR = "0.0.0.0:50055"
KAGUYA_LISTENER_AUDIO_ADDR = "0.0.0.0"
KAGUYA_LISTENER_AUDIO_PORT = "50056"
KAGUYA_LLM_BASE_URL = "http://localhost:1234"

[runtime.runtimes.voice_stack.capabilities.listener]
enabled = true
criticality = "degraded_usable"
fallback = "limited"

[runtime.runtimes.reasoner]
enabled = true
managed = false
criticality = "degraded_usable"
activation = "on_demand"
restart = "on_failure"
fallback = "stub"
provides = ["reasoner"]

[runtime.runtimes.reasoner.endpoints]
grpc = "http://127.0.0.1:50054"

[runtime.runtimes.llm_server]
enabled = true
managed = false
criticality = "degraded_usable"
activation = "eager"
fallback = "none"
health_url = "http://localhost:1234/v1/models"
poll_interval_ms = 5000
provides = ["llm"]

[files]
# Paths are resolved relative to the Gateway's cwd (`<repo>/gateway`).
soul_path      = "../config/SOUL.md"
identity_path  = "../config/IDENTITY.md"
workspace_root = ".."

[history]
max_recent_turns = 50

[silence]
soft_prompt_secs   = 3
follow_up_secs     = 8
context_shift_secs = 30
# Disabled until B10 reworks the silence prompt to let the LLM stay silent.
# The timers still tick (tier semantics preserved) — only the proactive
# LLM dispatch is suppressed.
enabled            = false

[rag]
db_path = "data/kaguya.db"
# embedding_url = "http://127.0.0.1:8081"
top_k = 10
# Defensive cap on stored memory content (chars). Real voice utterances
# never approach this; guards against pathological pastes (REF-010).
max_storage_chars = 4096
# Output-side caps (chars) applied at retrieval / export time. Defaults
# unlimited — let the model context budget govern. Set to bound per-turn
# prompt cost when many retrievals fire (REF-010).
# max_chars_per_result = 400
# max_chars_per_md_entry = 300
