profile = "app"
supervisor_addr = "127.0.0.1:3001"

[sandbox]
# Supervisor-owned provider used by Gateway's sandbox_exec tool (REF-015).
enabled = true
backend = "native"
mode = "single_user"
workspace_root = ".."
default_timeout_secs = 30
max_output_bytes = 16384
allowed_languages = ["python", "node", "bash"]
image = "kaguya-sandbox:latest"
pool_size = 0
memory_limit_mb = 512
pids_limit = 128
cpus = 1.0
network = false

[profiles.app.processes.gateway]
enabled = true
label = "Gateway"
launch = "eager"
criticality = "required"
restart = "on_failure"
max_restarts = 5
restart_window_secs = 300
command = "source $HOME/.cargo/env && cargo run --features dev-console"
command_win32 = "cargo run --features dev-console"
cwd = "../gateway"
provides = ["gateway"]

[profiles.app.processes.gateway.env]
RUST_LOG = "kaguya_gateway=debug"

[profiles.app.processes.gateway.endpoints]
grpc = "http://127.0.0.1:50051"
websocket = "http://127.0.0.1:8080"

[profiles.app.processes.voice_stack]
enabled = true
label = "Voice Stack"
launch = "eager"
criticality = "required"
restart = "keep_alive"
max_restarts = 5
restart_window_secs = 300
command = ".venv/bin/python main.py"
command_win32 = ".venv\\Scripts\\python.exe main.py"
cwd = "../talker"
provides = ["talker", "listener", "stt", "vad", "tts"]

[profiles.app.processes.voice_stack.env]
KAGUYA_LLM_BASE_URL = "http://localhost:1234"

[profiles.app.processes.voice_stack.bind]
talker_grpc = "0.0.0.0:50053"
listener_grpc = "0.0.0.0:50055"
listener_audio = "0.0.0.0:50056"

[profiles.app.processes.voice_stack.endpoints]
talker_grpc = "http://127.0.0.1:50053"
listener_grpc = "http://127.0.0.1:50055"
listener_audio = "127.0.0.1:50056"

[profiles.app.processes.reasoner]
enabled = true
label = "Reasoner"
launch = "on_demand"
criticality = "degraded_usable"
restart = "on_failure"
command = "npm run dev"
command_win32 = "npm.cmd run dev"
cwd = "../reasoner"
provides = ["reasoner"]

[profiles.app.processes.reasoner.endpoints]
grpc = "http://127.0.0.1:50054"

[profiles.app.processes.llm_server]
enabled = true
label = "LLM server"
launch = "external"
criticality = "degraded_usable"
restart = "never"
provides = ["llm"]
health_url = "http://localhost:1234/v1/models"
poll_interval_ms = 5000

[profiles.dev_standalone.processes.gateway]
enabled = true
label = "Gateway"
launch = "external"
criticality = "required"
restart = "never"
command = "source $HOME/.cargo/env && cargo run --features dev-console"
command_win32 = "cargo run --features dev-console"
cwd = "../gateway"
provides = ["gateway"]

[profiles.dev_standalone.processes.gateway.env]
RUST_LOG = "kaguya_gateway=debug"

[profiles.dev_standalone.processes.gateway.endpoints]
grpc = "http://127.0.0.1:50051"
websocket = "http://127.0.0.1:8080"

[profiles.dev_standalone.processes.voice_stack]
enabled = true
label = "Voice Stack"
launch = "external"
criticality = "degraded_usable"
restart = "never"
command = ".venv/bin/python main.py"
command_win32 = ".venv\\Scripts\\python.exe main.py"
cwd = "../talker"
provides = ["talker", "listener", "stt", "vad", "tts"]

[profiles.dev_standalone.processes.voice_stack.env]
KAGUYA_LLM_BASE_URL = "http://localhost:1234"

[profiles.dev_standalone.processes.voice_stack.bind]
talker_grpc = "0.0.0.0:50053"
listener_grpc = "0.0.0.0:50055"
listener_audio = "0.0.0.0:50056"

[profiles.dev_standalone.processes.voice_stack.endpoints]
talker_grpc = "http://127.0.0.1:50053"
listener_grpc = "http://127.0.0.1:50055"
listener_audio = "127.0.0.1:50056"

[profiles.dev_standalone.processes.reasoner]
enabled = true
label = "Reasoner"
launch = "external"
criticality = "degraded_usable"
restart = "never"
provides = ["reasoner"]

[profiles.dev_standalone.processes.reasoner.endpoints]
grpc = "http://127.0.0.1:50054"
