<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kaguya Console — Turns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* paper / neutrals (warm) */
    --paper:        #F1ECE2;
    --paper-2:      #E8E2D6;
    --paper-3:      #DBD3C3;
    --panel:        #F7F3EB;
    --panel-2:      #FBF8F2;
    --hairline:     #E2DBCC;
    --rule:         #C8C0AE;

    /* ink */
    --ink:          #2A3645;
    --ink-2:        #4A5567;
    --ink-3:        #7B8696;
    --ink-4:        #A9B2BF;

    /* dusty pastel blues (from palette) */
    --blue:         #7B92AE;   /* primary */
    --blue-2:       #5A7595;   /* deep, for selected/active */
    --blue-soft:    #9FB4CC;
    --blue-pale:    #C9D3E0;
    --blue-mist:    #E2E8EE;

    /* accents */
    --mint:         #9CB8A6;   /* ok / healthy */
    --mint-soft:    #D5E1D7;
    --amber:        #C9A56B;   /* warn */
    --amber-soft:   #E9DBC3;
    --terra:        #B97862;   /* danger */
    --terra-soft:   #E8C9C0;
    --plum:         #8E7A95;   /* tool / reasoner accent */
    --plum-soft:    #DAD2DF;

    /* shadow */
    --shadow-1: 0 1px 0 rgba(42,54,69,0.04), 0 1px 2px rgba(42,54,69,0.05);
    --shadow-2: 0 1px 0 rgba(42,54,69,0.04), 0 2px 6px rgba(42,54,69,0.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ============================================================
     SHELL
  ============================================================ */
  .app {
    display: grid;
    grid-template-rows: 44px 1fr var(--logs-h, 240px);
    grid-template-columns: 248px 1fr 360px;
    height: 100vh;
    background: var(--paper);
  }
  .topbar {
    grid-column: 1 / -1;
    background: var(--panel-2);
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center;
    padding: 0 14px;
    gap: 14px;
  }
  .left {
    grid-row: 2 / 3;
    border-right: 1px solid var(--rule);
    background: var(--panel);
    overflow-y: auto;
    padding: 14px 12px;
  }
  .center {
    grid-row: 2 / 3;
    background: var(--paper);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .right {
    grid-row: 2 / 3;
    border-left: 1px solid var(--rule);
    background: var(--panel-2);
    overflow-y: auto;
  }
  .logs {
    grid-column: 1 / -1;
    border-top: 1px solid var(--rule);
    background: #FBF8F2;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .app.logs-collapsed { grid-template-rows: 44px 1fr min-content; }
  .app.logs-collapsed .logs > :not(.log-toolbar):not(.prompt-bar) { display: none; }
  .logs-toggle {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid transparent;
    color: var(--ink-3); font: 11px 'JetBrains Mono';
    padding: 2px 7px; border-radius: 4px;
    cursor: pointer;
  }
  .logs-toggle:hover { background: var(--paper-2); color: var(--ink); }
  .logs-toggle kbd {
    font: 10px 'JetBrains Mono';
    background: var(--paper-2); border: 1px solid var(--hairline);
    border-radius: 3px; padding: 0 4px; color: var(--ink-3);
  }
  .logs-toggle .caret { transition: transform .15s ease; }
  .app.logs-collapsed .logs-toggle .caret { transform: rotate(180deg); }

  /* ============================================================
     TOPBAR
  ============================================================ */
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 13px; letter-spacing: -0.01em;
    white-space: nowrap; flex-shrink: 0;
  }
  .brand .moon {
    width: 18px; height: 18px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 35%, #FBF8F2 0 35%, #E8E2D6 36% 60%, #DBD3C3 61% 100%);
    box-shadow: inset 0 0 0 1px rgba(42,54,69,0.1);
  }
  .session-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--blue-mist);
    border: 1px solid var(--blue-pale);
    color: var(--ink-2);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    white-space: nowrap; flex-shrink: 0;
  }
  .session-chip .mono { color: var(--ink); font-weight: 500; }
  .ws-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--mint-soft);
    border: 1px solid var(--mint);
    color: #4F6B57;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap; flex-shrink: 0;
  }
  .ws-pill .live {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 0 0 rgba(156,184,166,0.7);
    animation: live-pulse 2s ease-out infinite;
  }
  @keyframes live-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(156,184,166,0.7); }
    70%  { box-shadow: 0 0 0 6px rgba(156,184,166,0); }
    100% { box-shadow: 0 0 0 0 rgba(156,184,166,0); }
  }
  .counter {
    font-family: 'JetBrains Mono';
    font-size: 11px;
    color: var(--ink-3);
    display: inline-flex; align-items: baseline; gap: 6px;
    white-space: nowrap; flex-shrink: 0;
  }
  .counter b { color: var(--ink); font-weight: 500; }
  .top-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 5px 11px;
    font: 500 12px 'Inter', sans-serif;
    cursor: pointer;
    transition: background .12s, border-color .12s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--paper-2); border-color: var(--ink-4); }
  .btn.primary {
    background: var(--blue-2); color: #FBF8F2; border-color: var(--blue-2);
  }
  .btn.primary:hover { background: #4A6585; border-color: #4A6585; }
  .btn.danger {
    background: var(--paper-2); color: var(--terra); border-color: var(--terra);
  }
  .btn.danger:hover { background: var(--terra); color: #FBF8F2; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .topbar .btn:hover { background: rgba(255,255,255,0.7); border-color: rgba(31,54,80,0.32); }
  .topbar .btn.primary { background: #1F3650; border-color: #1F3650; color: #F5F0E4; }
  .topbar .btn.primary:hover { background: #0F2438; border-color: #0F2438; }
  .topbar .btn.danger { background: rgba(255,255,255,0.45); color: var(--terra); border-color: var(--terra); }
  .btn.ghost:hover { background: var(--paper-2); }
  .btn.tiny { padding: 3px 8px; font-size: 11px; border-radius: 5px; }
  .btn.icon { padding: 4px 6px; }
  .btn[disabled] { opacity: 0.4; pointer-events: none; }

  /* ============================================================
     LEFT — PROCESSES
  ============================================================ */
  .lbl {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .proc {
    background: var(--panel-2);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 10px 11px;
    margin-bottom: 8px;
    transition: border-color .12s, box-shadow .12s;
  }
  .proc:hover { border-color: var(--blue-pale); box-shadow: var(--shadow-1); }
  .proc.selected { border-color: var(--blue); box-shadow: var(--shadow-2); }
  .proc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; min-width: 0; }
  .proc-name { font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .proc-tag {
    font-size: 9px; font-weight: 600; letter-spacing: 0.06em;
    padding: 1px 5px; border-radius: 3px;
    text-transform: uppercase;
    background: var(--paper-2); color: var(--ink-3); border: 1px solid var(--hairline);
  }
  .proc-tag.unmanaged { background: var(--blue-mist); color: var(--blue-2); border-color: var(--blue-pale); }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--ink-4);
    margin-left: auto;
  }
  .proc-tag { flex-shrink: 0; }
  .status-dot.running { background: var(--mint); box-shadow: 0 0 0 2px rgba(156,184,166,0.25); }
  .status-dot.starting { background: var(--amber); }
  .status-dot.errored { background: var(--terra); }
  .proc-meta {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 2px 10px;
    font-family: 'JetBrains Mono';
    font-size: 10px;
    color: var(--ink-3);
  }
  .proc-meta b { color: var(--ink); font-weight: 500; }
  .proc-actions {
    display: flex; gap: 4px; margin-top: 8px;
  }

  /* ============================================================
     TABS
  ============================================================ */
  .tabs {
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--rule);
    background: var(--panel-2);
    padding: 0 12px;
    flex-shrink: 0;
  }
  .tab {
    border: none; background: transparent;
    color: var(--ink-3);
    font: 500 13px 'Inter', sans-serif;
    padding: 12px 14px;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--blue-2);
  }
  .tab .badge {
    background: var(--blue-mist);
    color: var(--blue-2);
    font: 600 10px 'JetBrains Mono';
    padding: 1px 6px; border-radius: 999px;
  }
  .tab.active .badge { background: var(--blue-2); color: var(--panel-2); }

  /* ============================================================
     TURNS TAB
  ============================================================ */
  .turns-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  .turns-toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }
  .highlight-chips { display: flex; align-items: center; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 6px;
    background: var(--panel-2);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 11px; color: var(--ink-3);
    cursor: pointer;
    user-select: none;
    transition: all .12s;
    white-space: nowrap; flex-shrink: 0;
  }
  .chip:hover { border-color: var(--ink-4); color: var(--ink); }
  .chip .swatch {
    width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0;
    background: var(--ink-4);
  }
  .chip.on {
    background: #fff;
    border-color: currentColor;
    color: var(--ink);
    box-shadow: var(--shadow-1);
  }
  .chip.on.interrupted { color: var(--terra); }
  .chip.on.interrupted .swatch { background: var(--terra); }
  .chip.interrupted .swatch { background: var(--terra); }
  .chip.on.tool { color: var(--plum); }
  .chip.on.tool .swatch { background: var(--plum); }
  .chip.tool .swatch { background: var(--plum); }
  .chip.on.delegated { color: var(--blue-2); }
  .chip.on.delegated .swatch { background: var(--blue-2); }
  .chip.delegated .swatch { background: var(--blue-2); }
  .chip.on.bargein { color: var(--amber); }
  .chip.on.bargein .swatch { background: var(--amber); }
  .chip.bargein .swatch { background: var(--amber); }

  .search {
    flex: 1; min-width: 180px; max-width: 320px;
    border: 1px solid var(--hairline);
    background: #fff;
    border-radius: 6px;
    padding: 5px 10px;
    font: 12px 'Inter';
    color: var(--ink);
    outline: none;
  }
  .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(123,146,174,0.15); }

  .seg {
    display: inline-flex;
    background: var(--panel-2);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    overflow: hidden;
    font-size: 11px;
  }
  .seg button {
    border: none; background: transparent;
    color: var(--ink-3);
    padding: 4px 10px;
    cursor: pointer;
    border-right: 1px solid var(--hairline);
  }
  .seg button:last-child { border-right: none; }
  .seg button.on {
    background: #fff;
    color: var(--ink);
    font-weight: 500;
  }

  /* turns list */
  .turn-list { flex: 1; overflow-y: auto; padding: 4px 0 60px; }
  .turn-row {
    display: grid;
    grid-template-columns: 4px 76px 1fr 90px;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    position: relative;
    transition: background .1s;
  }
  .turn-row { background: #FBF8F2; }
  .turn-row:hover { background: var(--paper-2); }
  .turn-row.dim { opacity: 0.28; }
  .turn-row.selected {
    background: var(--blue-mist);
  }
  .turn-row.selected:hover { background: var(--blue-mist); }
  .turn-row.user { background: #FBF8F2; }
  .turn-row.user:hover { background: var(--paper-2); }

  .stripes { display: flex; flex-direction: column; gap: 2px; height: 100%; }
  .stripe {
    flex: 1;
    background: var(--ink-4);
    border-radius: 2px;
    min-height: 6px;
  }
  .stripe.interrupted { background: var(--terra); }
  .stripe.tool { background: var(--plum); }
  .stripe.delegated { background: var(--blue-2); }
  .stripe.bargein { background: var(--amber); }

  .turn-time {
    font-family: 'JetBrains Mono';
    font-size: 11px;
    color: var(--ink-3);
    line-height: 1.4;
  }
  .turn-time .abs { color: var(--ink); font-weight: 500; }
  .turn-time .rel { font-size: 10px; }

  .turn-body { min-width: 0; }
  .turn-who {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-3); font-weight: 600;
    margin-bottom: 4px;
  }
  .turn-who .who-name { color: var(--ink); letter-spacing: 0.05em; }
  .turn-who .turn-id { font-family: 'JetBrains Mono'; font-size: 9px; color: var(--ink-4); text-transform: none; letter-spacing: 0; }
  .turn-tags { display: inline-flex; gap: 4px; }
  .tag {
    font: 600 9px 'JetBrains Mono';
    padding: 1px 5px; border-radius: 3px;
    border: 1px solid currentColor;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tag.interrupted { color: var(--terra); background: var(--terra-soft); }
  .tag.tool { color: var(--plum); background: var(--plum-soft); }
  .tag.delegated { color: var(--blue-2); background: var(--blue-mist); }
  .tag.bargein { color: var(--amber); background: var(--amber-soft); }
  .tag.live {
    color: var(--mint); background: var(--mint-soft);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .tag.live::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--mint);
    animation: live-pulse 1.4s ease-out infinite;
  }
  .turn-text {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.55;
    text-wrap: pretty;
  }
  .turn-text.user { color: var(--ink-2); font-weight: 500; }
  .turn-meta-mini {
    margin-top: 6px;
    display: flex; flex-wrap: wrap; gap: 12px;
    font-family: 'JetBrains Mono'; font-size: 10px; color: var(--ink-3);
  }
  .turn-meta-mini b { color: var(--ink); font-weight: 500; }

  .turn-marks { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .audio-mini {
    width: 80px; height: 24px;
    background: var(--panel-2);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  /* in-flight pulse */
  .turn-row.live { background: #FBF8F2; }
  .turn-row.live:hover { background: var(--paper-2); }
  .turn-row.live::before {
    content: none;
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--mint);
    animation: breath 1.6s ease-in-out infinite;
  }
  @keyframes breath {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }
  .turn-row.live .turn-text { animation: text-breath 1.6s ease-in-out infinite; }
  @keyframes text-breath {
    0%, 100% { color: var(--ink-3); }
    50%      { color: var(--ink); }
  }
  .sentence-flash {
    animation: flash 0.9s ease-out;
  }
  @keyframes flash {
    0%   { background: rgba(156,184,166,0.35); }
    100% { background: transparent; }
  }

  /* ============================================================
     INSPECTOR
  ============================================================ */
  .insp-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--hairline);
    background: var(--panel-2);
  }
  .insp-eyebrow {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600;
    margin-bottom: 4px;
  }
  .insp-title {
    font-family: 'JetBrains Mono';
    font-size: 13px; color: var(--ink); font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .insp-title .pin {
    font-size: 9px; padding: 2px 6px;
    background: var(--blue-mist); color: var(--blue-2);
    border-radius: 3px; font-family: 'Inter'; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }

  .insp-section { padding: 14px 16px; border-bottom: 1px solid var(--hairline); }
  .insp-section h4 {
    margin: 0 0 10px;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  .insp-section h4 .meta-r { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--ink-4); text-transform: none; letter-spacing: 0; }

  .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .stat {
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .stat .k {
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; margin-bottom: 2px;
  }
  .stat .v {
    font-family: 'JetBrains Mono';
    font-size: 16px; color: var(--ink); font-weight: 500;
  }
  .stat .v small {
    font-size: 11px; color: var(--ink-3); margin-left: 3px;
  }

  /* emotion track */
  .emo-track {
    height: 36px;
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    display: flex;
  }
  .emo-band {
    height: 100%;
    border-right: 1px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono'; font-size: 10px;
    color: var(--ink-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 6px;
  }
  .emo-band:last-child { border-right: none; }
  .emo-cheerful { background: #F4E4D2; color: #8B6F4D; }
  .emo-warm     { background: #EFD8C8; color: #8C5F47; }
  .emo-neutral  { background: var(--blue-mist); color: var(--blue-2); }
  .emo-thoughtful { background: var(--plum-soft); color: #5E4D6A; }
  .emo-curious  { background: var(--mint-soft); color: #4F6B57; }

  .track-axis {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono'; font-size: 9px;
    color: var(--ink-4);
    margin-top: 4px;
  }

  /* event timeline */
  .events { display: flex; flex-direction: column; }
  .event {
    display: grid;
    grid-template-columns: 56px 18px 1fr;
    column-gap: 10px;
    padding: 6px 0;
    position: relative;
  }
  .event:not(:last-child)::after {
    content: '';
    position: absolute;
    left: 64px; top: 16px; bottom: -6px;
    width: 1px;
    background: var(--hairline);
  }
  .event .t {
    font-family: 'JetBrains Mono'; font-size: 10px;
    color: var(--ink-3); padding-top: 2px;
  }
  .event .icon {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--blue-mist);
    color: var(--blue-2);
    border: 1px solid var(--blue-pale);
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 10px 'JetBrains Mono';
    flex-shrink: 0;
    z-index: 1;
  }

  .ptt-btn:active, .ptt-btn.held {

  .ptt-card .ptt-text .l2 { font: 11px 'JetBrains Mono'; color: var(--ink-3); margin-top: 2px; }

    border-radius: 6px;

    const h = 12 + Math.abs(Math.sin((i + seed) * 0.6)) * 70 + Math.abs(Math.cos((i + seed) * 0.31)) * 18;
    return Math.min(96, h);
  });
  const playFrac = turn.live ? Math.min(0.9, (turn.sentenceCount * 0.4)) : 0.42;

        <div className="wave-bars">

            <div key={i} className="b"
              style={{ height: `${h}%`, opacity: i / n < playFrac ? 1 : 0.4 }} />
          ))}

        <div className="wave-playhead" style={{ left: `${playFrac * 100}%` }} />
      </div>
      <div className="wave-controls">

        <button className="btn tiny ghost">⤓ WAV</button>

  );

function LiveMeter({ kind }) {
  // animated pseudo-RMS bars; placeholder until real AnalyserNode is wired
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 80);
    return () => clearInterval(id);
  }, []);
  const n = 64;
  const idle = kind === 'input';
  const bars = Array.from({ length: n }).map((_, i) => {
    const phase = (i + tick) * (kind === 'input' ? 0.34 : 0.62);
    const env = Math.abs(Math.sin(phase)) * 0.6 + Math.abs(Math.cos(phase * 0.27)) * 0.4;
    const bias = kind === 'input' ? 0.18 : 0.7;
    const h = 6 + env * bias * 100;
    return Math.min(95, h);
  });
  return (
    <div className={'live-meter ' + (kind === 'input' ? 'input' : '') + (idle ? ' idle' : '')}>
      {bars.map((h, i) => <div key={i} className="b" style={{ height: `${h}%` }} />)}
    </div>
  );
}

function TranscriptTimeline({ turns, onSelect }) {
  function relToSec(rel) {
    if (!rel) return 0;
    const s = rel.replace('−', '-').replace('+', '');
    const m = s.match(/(?:(-?\d+)m\s*)?(-?[\d.]+)s/);
    if (!m) return 0;
    return Math.abs(parseFloat(m[1] || '0') * 60 + parseFloat(m[2] || '0'));
  }
  const ages = turns.map(t => relToSec(t.rel));
  const maxAge = Math.max(...ages, 30);
  const totalSec = Math.ceil(maxAge / 30) * 30;

  // Build typed blocks across four lanes: user, talker, tool, reasoner
  const blocks = [];
  turns.forEach(t => {
    const ageSec = relToSec(t.rel);
    if (t.role === 'user') {
      blocks.push({ id: t.id, lane: 'user', start: ageSec, dur: 0.6, turnId: t.id, label: t.text, kind: 'user' });
      return;
    }
    // assistant turn → talker block
    const dur = t.live ? 1.4 : (t.dur || 0) / 1000;
    const tags = t.tags || [];
    let kind = 'talker';
    if (tags.includes('interrupted')) kind = 'interrupted';
    blocks.push({ id: t.id, lane: 'talker', start: ageSec, dur, turnId: t.id, label: t.id, kind, live: t.live });
    if (tags.includes('tool')) {
      blocks.push({ id: t.id + '-tool', lane: 'tool', start: ageSec - 0.2, dur: Math.max(0.4, dur * 0.25), turnId: t.id, label: 'get_weather', kind: 'tool' });
    }
    if (tags.includes('delegated') && t.delegate) {
      blocks.push({ id: t.id + '-rsr', lane: 'reasoner', start: ageSec - 0.05, dur: Math.max(0.8, dur * 0.4), turnId: t.id, label: '', kind: 'reasoner' });
    }
  });

  const LANES = [
    { id: 'user',     label: 'User' },
    { id: 'talker',   label: 'Talker' },
    { id: 'tool',     label: 'Tool' },
    { id: 'reasoner', label: 'Reasoner' },
  ];

  return (
    <div className="net-tl">
      <div className="net-axis-row">
        <span className="lane-gutter"></span>
        <div className="net-axis">
          <span>−{totalSec}s</span>
          <span>−{Math.round(totalSec * 0.66)}s</span>
          <span>−{Math.round(totalSec * 0.33)}s</span>
          <span>now</span>
        </div>
      </div>
      <div className="net-lanes">
        {LANES.map(L => (
          <div key={L.id} className="net-lane">
            <span className="lane-gutter">{L.label}</span>
            <div className="net-track">
              {blocks.filter(b => b.lane === L.id).map(b => {
                const startPct = ((totalSec - b.start) / totalSec) * 100;
                const widthPct = (b.dur / totalSec) * 100;
                const cls = ['net-block', b.kind];
                if (b.live) cls.push('live');
                return (
                  <div key={b.id} className={cls.join(' ')}
                    onClick={() => onSelect(b.turnId)}
                    title={b.label}
                    style={{
                      left: `${Math.max(0, Math.min(99.5, startPct))}%`,
                      width: `${Math.max(1.2, Math.min(100 - startPct, widthPct))}%`,
                    }}>
                    {widthPct > 10 ? <span className="bl">{b.label}</span> : null}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function LiveInspector({ turns, onSelectTurn }) {
  // Default view: pin to latest turn (streaming if there is one, else most recent assistant).
  const live = turns.find(t => t.live);
  const latest = live || turns.find(t => t.role === 'assistant');
  if (!latest) {
    return (
      <div className="insp-head">
        <div className="insp-eyebrow">Live</div>
        <div className="insp-title">Idle</div>
        <div style={{ marginTop: 6, fontSize: 11, color: 'var(--ink-3)', fontFamily: 'JetBrains Mono' }}>
          waiting for first turn…
        </div>
      </div>
    );
  }
  return <TurnInspectorBody turn={latest} streaming={!!live && latest.id === live.id} />;
}

function Inspector({ turn, turns, onSelectTurn }) {
  if (!turn || turn.role === 'user') {
    return <LiveInspector turns={turns} onSelectTurn={onSelectTurn} />;
  }
  return <TurnInspectorBody turn={turn} streaming={!!turn.live} pinned />;
}

function TurnInspectorBody({ turn, streaming, pinned }) {
  const skel = (label, content) => streaming && content == null
    ? <span className="skel">{label}</span>
    : content;
  return (
    <>
      <div className="insp-head">
        <div className="insp-eyebrow">{streaming ? 'Streaming' : (pinned ? 'Turn inspector' : 'Latest turn')}</div>
        <div className="insp-title">
          {turn.id}
          {streaming
            ? <span className="pin streaming">live</span>
            : pinned ? <span className="pin">pinned</span> : <span className="pin latest">latest</span>}
        </div>
        <div style={{ marginTop: 6, fontSize: 11, color: 'var(--ink-3)', fontFamily: 'JetBrains Mono' }}>
          started {turn.abs}{streaming ? ' · in flight' : ` · ${(turn.dur / 1000).toFixed(2)}s`}
        </div>
      </div>

      <div className="insp-section">
        <h4>Statistics</h4>
        <Stats turn={turn} streaming={streaming} />
      </div>

      <div className="insp-section">
        <h4>Emotion track <span className="meta-r">{turn.emotions ? turn.emotions.length : 0} events</span></h4>
        {turn.emotions && turn.emotions.length
          ? <EmotionTrack turn={turn} />
          : <div className="skel-row">no emotion events yet…</div>}
      </div>

      <div className="insp-section">
        <h4>Audio {turn.audioKb ? <span className="meta-r">{turn.audioKb} KB · 24 kHz · pcm_s16le</span> : <span className="meta-r skel">waiting · 24 kHz · pcm_s16le</span>}</h4>
        <Waveform turn={turn} />
      </div>

      <div className="insp-section">
        <h4>Event timeline <span className="meta-r">{(turn.events || []).length} events{streaming ? ' · streaming' : ''}</span></h4>
        <EventTimeline turn={turn} />
      </div>

      <div className="insp-section" style={{ borderBottom: 'none' }}>
        <h4>Sentences</h4>
        <div className="sent-list">
          {(turn.sentences || []).map((s, i) => (
            <div className="sent" key={i}>
              <span className="ts">+{s.t.toFixed(2)}s</span>
              <span>{s.text}</span>
            </div>
          ))}
          {streaming && (
            <div className="sent">
              <span className="ts skel">+?.??s</span>
              <span className="skel">awaiting next sentence…</span>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

/* ============================================================
   LOG PANEL
============================================================ */

function LogPanel({ collapsed, onToggle }) {
  const [src, setSrc] = useState('all');
  const [lvl, setLvl] = useState('INFO+');
  const scrollRef = useRef(null);
  const [autoScroll, setAutoScroll] = useState(true);
  const filtered = useMemo(() => LOGS.filter(l => {
    if (src !== 'all' && l.src !== src) return false;
    if (lvl === 'WARN+'  && !['WARN', 'ERROR'].includes(l.lvl)) return false;
    if (lvl === 'ERROR'  && l.lvl !== 'ERROR') return false;
    return true;
  }), [src, lvl]);

  // oldest → newest (terminal feel)
  const ordered = useMemo(() => [...filtered].reverse(), [filtered]);

  useEffect(() => {
    if (autoScroll && scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [ordered, autoScroll]);

  function onScroll() {
    const el = scrollRef.current;
    if (!el) return;
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
    setAutoScroll(atBottom);
  }

  const [prompt, setPrompt] = useState('');
  function sendPrompt() {
    if (!prompt.trim()) return;
    setPrompt('');
  }

  return (
    <div className="logs">
      <div className="prompt-bar">
        <span className="prompt-pre">›</span>
        <input
          className="prompt-input"
          placeholder="Send a text prompt to Kaguya…"
          value={prompt}
          onChange={e => setPrompt(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt(); } }}
        />
        <span className="prompt-hint">⏎ send</span>
        <button className="send-btn" onClick={sendPrompt} disabled={!prompt.trim()}>Send</button>
      </div>
      <div className="log-toolbar">
        <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--ink-3)' }}>Logs</span>
        <div className="seg">
          {['all', 'gateway', 'talker', 'llm_server'].map(s => (
            <button key={s} className={src === s ? 'on' : ''} onClick={() => setSrc(s)}>{s}</button>
          ))}
        </div>
        <div className="seg">
          {['ALL', 'INFO+', 'WARN+', 'ERROR'].map(l => (
            <button key={l} className={lvl === l ? 'on' : ''} onClick={() => setLvl(l)}>{l}</button>
          ))}
        </div>
        <input className="search" placeholder="filter… (regex ok)" />
        <span style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center' }}>
          <span className="counter mono"><b>{filtered.length}</b> / 312 entries · 1421/min</span>
          <button className="btn tiny">Pause</button>
          <button className="btn tiny">Clear</button>
          <button className="btn tiny">Save .log</button>
          <button className="logs-toggle" onClick={onToggle} title={collapsed ? 'Expand logs' : 'Collapse logs'}>
            <span className="caret">▾</span>
            <kbd>⌃`</kbd>
          </button>
        </span>
      </div>
      <div className="log-rows" ref={scrollRef} onScroll={onScroll}>
        {ordered.map((l, i) => (
          <div key={i} className={'log-row ' + (l.lvl === 'ERROR' ? 'error' : l.lvl === 'WARN' ? 'warn' : '')}>
            <span className="ts">{l.ts}</span>
            <span className={'src ' + (l.src === 'llm_server' ? 'llm' : l.src)}>{l.src}</span>
            <span className="lvl">{l.lvl}</span>
            <span className="line">{l.line}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   APP
============================================================ */
function App() {
  const [selProc, setSelProc] = useState(null);
  const [selTurn, setSelTurn] = useState(null); // null = live monitor view
  const [highlights, setHighlights] = useState([]);
  const [query, setQuery] = useState('');
  const [logsCollapsed, setLogsCollapsed] = useState(false);

  useEffect(() => {
    function onKey(e) {
      // Ctrl+` (or Cmd+`) toggles logs, matching VS Code's terminal toggle
      if ((e.ctrlKey || e.metaKey) && e.key === '`') {
        e.preventDefault();
        setLogsCollapsed(c => !c);
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const selected = selTurn ? TURNS.find(t => t.id === selTurn) : null;
  function toggleTurn(id) {
    setSelTurn(prev => prev === id ? null : id);
  }

  return (
    <div className={'app' + (logsCollapsed ? ' logs-collapsed' : '')}>
      <Topbar />
      <LeftRail selProc={selProc} setSelProc={setSelProc} />
      <div className="center">
        <div className="turns-wrap">
          <div className="timeline-strip">
            <div className="strip-tl">
              <TranscriptTimeline turns={TURNS} onSelect={toggleTurn} />
            </div>
          </div>
          <TurnsToolbar
            active={highlights} setActive={setHighlights}
            query={query} setQuery={setQuery}
          />
          <TurnList
            turns={TURNS}
            selectedId={selTurn}
            onSelect={toggleTurn}
            highlights={highlights}
            query={query}
          />
        </div>
      </div>
      <div className="right">
        <Inspector turn={selected} turns={TURNS} onSelectTurn={toggleTurn} />
      </div>
      <LogPanel collapsed={logsCollapsed} onToggle={() => setLogsCollapsed(c => !c)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
