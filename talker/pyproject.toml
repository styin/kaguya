[project]
name = "kaguya-talker"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Kaguya Talker Agent — voice listener, LLM pipeline, TTS speaker"
requires-python = ">=3.11"
dependencies = [
    "RealtimeSTT",
    "RealtimeTTS[kokoro]",
    "opuslib",
    "grpcio>=1.78.0",
    "protobuf>=6.31.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "pip",
    "audioop-lts>=0.2.2 ; python_full_version >= '3.13'",
]

[tool.uv]
# Run this service from its source directory; no wheel or editable package.
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "grpcio-tools>=1.78.0",
    "mypy-protobuf>=3.6",
]

# To regenerate proto stubs: make proto (from repo root)
# Or: python scripts/gen_proto.py (from talker/)

[tool.ruff]
exclude = ["proto/"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
check_untyped_defs = true
# mypy-protobuf generates .pyi stubs for proto code, so mypy/Pylance can
# resolve protobuf message/enum attributes. The grpc stubs have @overload
# signatures that mypy flags (overload-cannot-match) — suppress on generated
# code only; authored code is fully checked.
[[tool.mypy.overrides]]
module = "proto.*"
disable_error_code = ["overload-cannot-match"]
