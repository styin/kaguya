syntax = "proto3";
package kaguya.v1;

// Distinct ID types keep instance and session roles explicit in generated APIs.
// Receivers still validate canonical, non-nil UUIDs and the accepted pair.
message InstanceId {
  string value = 1;
}
message SessionId {
  string value = 1;
}
message SessionRef {
  InstanceId instance_id = 1;
  SessionId session_id = 2;
}

// ─────────────────────────────────────────────
// SHARED TYPES
// ─────────────────────────────────────────────

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
  ROLE_TOOL = 4;
}

message ChatMessage {
  Role role = 1;
  string content = 2;
  string name = 3;
  int64 timestamp_ms = 4;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string args_schema = 3;
}

// LISTENER SERVICE — Bidirectional streaming
// Gateway = client, Listener = server
//
// Audio bytes do NOT flow over this gRPC stream. The Gateway forwards raw
// audio frames over a separate TCP socket (length-prefixed framing) at
// `listener_audio_addr`. Reasoning: 50fps audio + protobuf serialization
// overhead is wasteful for the Phase-1 local-only deployment, and gRPC's
// HTTP/2 framing adds head-of-line blocking that voice latency can't
// afford. See `docs/spec-agent-v0.1.0.md` and the raw-socket forwarder in
// `gateway/src/clients/listener.rs`.

service ListenerService {
  // Gateway initializes scope, then may send controls; Listener streams ASR events.
  rpc Stream(stream ListenerInput) returns (stream ListenerOutput);
}

message ListenerInput {
  oneof payload {
    ListenerInit init = 1; // required first, once per stream
    ListenerControl control = 2;
  }
}

// Scope assertion for every Listener subscription.
message ListenerInit {
  SessionRef session = 1;
}

// Extension point for Listener lifecycle controls. Reset is declared but
// currently returns UNIMPLEMENTED; future controls require defined semantics.
message ListenerControl {
  oneof signal {
    ListenerReset reset = 1;
  }
}
message ListenerReset {}

message ListenerOutput {
  int64 timestamp_ms = 1;
  oneof event {
    VadSpeechStart vad_speech_start = 2;
    VadSpeechEnd vad_speech_end = 3;
    PartialTranscript partial_transcript = 4;
    FinalTranscript final_transcript = 5;
  }
}

message VadSpeechStart {}
message VadSpeechEnd {
  float silence_duration_ms = 1;
}
message PartialTranscript {
  string text = 1;
}
message FinalTranscript {
  string text = 1;
  float confidence = 2;
}

// TALKER SERVICE — Bidi Converse + unary helpers
// Gateway = client, Talker = server

service TalkerService {
  // Bidi: Gateway sends context + inline barge-in; Talker streams output
  rpc Converse(stream TalkerInput) returns (stream TalkerOutput);

  // Between-turn operations (unary, no need for bidi)
  rpc PrefillCache(PrefillRequest) returns (PrefillAck);
  rpc UpdatePersona(UpdatePersonaRequest) returns (PersonaAck);
}

message TalkerInput {
  oneof payload {
    GenerationStart start = 1; // first message; one generation per RPC
    BargeInSignal barge_in = 2; // interrupt mid-stream
  }
}

// Scope is set by the stream's GenerationStart. Talker acknowledges only the
// first barge-in of a Converse; later ones are ignored.
message BargeInSignal {}

// Reusable per-call context. Persona remains a change-driven UpdatePersona RPC.
message PromptContext {
  repeated ChatMessage history = 1;
  string memory_contents = 2;
  repeated ToolDefinition tools = 3;
  repeated ActiveTask active_tasks = 4;
  repeated RetrievalResult retrieval_results = 5;
}

message ActiveTask {
  string task_id = 1;
  string description = 2;
}

message GenerationStart {
  SessionRef session = 1;
  string generation_id = 2;
  int64 timestamp_ms = 3;
  PromptContext prompt_context = 4;
  oneof trigger {
    UserInput user_input = 5;
    ToolResult tool_result = 6;
    ReasonerResult reasoner_result = 7;
    ReasonerProgress reasoner_progress = 8;
    SilenceTrigger silence = 9;
    ReasonerFailure reasoner_failure = 10;
  }
}
message UserInput {
  string text = 1;
}
message ToolResult {
  string request_id = 1;
  string content = 2;
}
message ReasonerResult {
  string task_id = 1;
  string summary = 2;
}
message ReasonerProgress {
  string task_id = 1;
  string description = 2;
}
message ReasonerFailure {
  string task_id = 1;
  string message = 2;
  int32 code = 3;
}
message SilenceTrigger {
  uint64 duration_ms = 1;
}

// Retrieved memories included in the prompt snapshot.
message RetrievalResult {
  string id = 1;
  string content = 2;
  string source = 3; // "bm25" | "vector"
  float score = 4;
}

message TalkerOutput {
  uint32 seq = 1;
  // Required on every output; echoes the GenerationStart accepted by this RPC.
  string generation_id = 2;
  oneof payload {
    ResponseStarted response_started = 3;
    SentenceEvent sentence = 4;
    EmotionEvent emotion = 5;
    ToolRequest tool_request = 6;
    DelegateRequest delegate_request = 7;
    ResponseComplete response_complete = 8;
    BargeInAck barge_in_ack = 9;
  }
}

message BargeInAck {
  string spoken_text = 1;
  string unspoken_text = 2;
}

message ResponseStarted {}
message SentenceEvent {
  string text = 1;
}
message EmotionEvent {
  string emotion = 1;
}

message ToolRequest {
  string request_id = 1;
  string tool_name = 2;
  string args_json = 3;
}

message DelegateRequest {
  string task_id = 1;
  string description = 2;
}

message ResponseComplete {
  bool was_interrupted = 1;
}

message PrefillRequest {
  SessionRef session = 1;
  PromptContext prompt_context = 2;
}
message PrefillAck {}

message PersonaConfig {
  string soul_md = 1;
  string identity_md = 2;
  string memory_md = 3;
}
message UpdatePersonaRequest {
  SessionRef session = 1;
  PersonaConfig persona = 2;
}
message PersonaAck {}

// REASONER SERVICE — Multi-stream design

service ReasonerService {
  // Bidi per-task: Gateway sends task + context updates, Reasoner streams events
  rpc Delegate(stream DelegateInput) returns (stream DelegateOutput);

  // Unary interrupt: always available, even when no delegation in flight
  rpc Interrupt(InterruptRequest) returns (InterruptAck);

  // Server-streaming telemetry: continuous background context
  rpc Telemetry(TelemetrySubscribe) returns (stream TelemetryEvent);
}

message DelegateInput {
  oneof payload {
    TaskRequest start_task = 1;
    TaskContext context_update = 2; // send updated context mid-task
  }
}

message TaskRequest {
  string task_id = 1;
  string description = 2;
  map<string, string> metadata = 3;
  SessionRef session = 4;
}

// Scope is set by the stream's initial TaskRequest.
message TaskContext {
  string task_id = 1;
  string context = 2; // additional context during execution
}

message DelegateOutput {
  string task_id = 1;
  int64 timestamp_ms = 2;
  oneof event {
    ReasonerStarted started = 3;
    ReasonerIntermediateStep step = 4;
    ReasonerOutput output = 5;
    ReasonerCompleted completed = 6;
    ReasonerError error = 7;
  }
}

message ReasonerStarted {
  string framework = 1;
}
message ReasonerIntermediateStep {
  string description = 1;
}
message ReasonerOutput {
  string content = 1;
}
message ReasonerCompleted {
  string summary = 1;
}
message ReasonerError {
  string message = 1;
  int32 code = 2;
}

message InterruptRequest {
  SessionRef session = 1;
  oneof signal {
    TaskCancel cancel = 2;
    GlobalStop stop = 3;
    Shutdown shutdown = 4;
  }
}
message TaskCancel {
  string task_id = 1;
}
message GlobalStop {}
message Shutdown {}
message InterruptAck {}

message TelemetrySubscribe {
  SessionRef session = 1;
}
message TelemetryEvent {
  string source = 1; // "openclaw" | "claude_code"
  string event_type = 2;
  string data = 3; // JSON
  int64 timestamp_ms = 4;
}

// ─────────────────────────────────────────────
// GATEWAY CONTROL (Endpoint → Gateway)
// ─────────────────────────────────────────────

service RouterControlService {
  rpc SendControl(ControlRequest) returns (ControlAck);
}

message ControlRequest {
  SessionRef session = 1;
  ControlSignal signal = 2;
}

message ControlSignal {
  oneof signal {
    StopSignal stop = 1;
    ApprovalSignal approval = 2;
    ShutdownSignal shutdown = 3;
  }
}
message StopSignal {}

// Declared for the approval contract; Gateway currently returns UNIMPLEMENTED.
message ApprovalSignal {
  string context = 1;
}
message ShutdownSignal {}
message ControlAck {}
