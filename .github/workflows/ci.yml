name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - run: cargo fmt --check
      - run: cargo test --all-targets

  talker:
    name: Talker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: talker
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Linux audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - name: Install macOS audio libraries
        if: runner.os == 'macOS'
        run: brew install opus
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uv venv
      - run: uv pip install pydantic-settings opuslib grpcio protobuf httpx pytest pytest-asyncio
      - run: uv run --no-project pytest tests/ -v
        env:
          PYTHONPATH: .

  talker-typecheck:
    name: Talker typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talker
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - run: uv venv
      - run: uv pip install pydantic-settings opuslib grpcio httpx mypy
      - run: uv run --no-project mypy config.py voice/ inference/ --ignore-missing-imports

  reasoner:
    name: Reasoner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: reasoner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test --if-present
