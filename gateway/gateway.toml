[server]
ws_addr   = "127.0.0.1:8080"
grpc_addr = "0.0.0.0:50051"

[files]
# Paths are resolved relative to the Gateway's cwd (`<repo>/gateway`).
soul_path      = "../config/SOUL.md"
identity_path  = "../config/IDENTITY.md"
workspace_root = ".."

[history]
max_recent_turns = 50

[silence]
soft_prompt_secs   = 3
follow_up_secs     = 8
context_shift_secs = 30
# Disabled until B10 reworks the silence prompt to let the LLM stay silent.
# The timers still tick (tier semantics preserved) only the proactive
# LLM dispatch is suppressed.
enabled            = false

[rag]
db_path = "data/kaguya.db"
# embedding_url = "http://127.0.0.1:8081"
top_k = 10
# Defensive cap on stored memory content (chars); content beyond this
# limit is discarded from the stored memory. Fidelity trade-offs: REF-010.
max_storage_chars = 4096
# Output-side caps (chars) applied at retrieval / export time. Defaults
# unlimited per entry; this does not enforce a total prompt token budget.
# Set to bound individual result/export lengths (REF-010).
# max_chars_per_result = 400
# max_chars_per_md_entry = 300

[supervisor]
# Runtime control plane. The Gateway requests an opaque sandbox handle here;
# backend choice, limits, prewarming, and cleanup live in kaguya.runtime.toml.
# KAGUYA_SUPERVISOR_URL overrides this value when Supervisor launches Gateway.
url = "http://127.0.0.1:3001"
