[package]
name = "kaguya-supervisor"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "kaguya-supervisor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-core = "0.3"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[features]
# Windows Job Object sandbox provider. Off by default because the native
# provider remains the zero-dependency self-hosting default.
sandbox-jobobject = ["dep:windows"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.12"
